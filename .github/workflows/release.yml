name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync
      - name: Tag must match package version
        run: |
          version="$(uv run python -c 'import pytest_calendar_chaos as p; print(p.__version__)')"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv run pytest
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify:
    name: Verify TestPyPI install
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install from TestPyPI into a clean environment and run the example
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv venv /tmp/verify-env
          # Only our own package comes from TestPyPI (anyone can upload there), and with
          # --no-deps nothing else can be pulled from it. Dependencies come from real PyPI.
          # TestPyPI's simple index can lag a few minutes behind an upload.
          for attempt in $(seq 1 20); do
            if uv pip install --python /tmp/verify-env/bin/python \
                 --no-cache --no-deps \
                 --index-url https://test.pypi.org/simple/ \
                 "pytest-calendar-chaos==$version"; then
              break
            fi
            test "$attempt" -lt 20
            sleep 15
          done
          # Keep these bounds in sync with [project].dependencies in pyproject.toml.
          uv pip install --python /tmp/verify-env/bin/python "pytest>=8.0" "time-machine>=2.14"
          cd examples
          set +e
          /tmp/verify-env/bin/python -m pytest -p no:cacheprovider > /tmp/out.txt 2>&1
          status=$?
          cat /tmp/out.txt
          test "$status" -ne 0
          grep -q "Calendar chaos" /tmp/out.txt

  publish-pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment for manual approval.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
